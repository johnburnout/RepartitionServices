name: Build Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]   # Publication d'une release : build + ajout des fichiers à la release
  workflow_dispatch:     # Lancement manuel (onglet Actions)
    inputs:
      tag:
        description: "Tag d'une release existante à compléter avec les exécutables (ex. v2.2). Laisser vide pour un simple build."
        required: false
        default: ""

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4  # Mise à jour vers v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow  # Ajout de pillow
    
    - name: Build Windows executable
      run: |
        pyinstaller --clean --onefile --windowed `
          --name "RepartitionServices" `
          --add-data "moteur;moteur" `
          --add-data "interface;interface" `
          --add-data "export;export" `
          --add-data "preferences_defaut.json;." `
          --hidden-import tkinter `
          --hidden-import tkinter.ttk `
          --hidden-import csv `
          --hidden-import datetime `
          --icon assets/icon.ico `
          main.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: RepartitionServices-Windows
        path: dist/RepartitionServices.exe

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4  # Mise à jour vers v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow  # Ajout de pillow pour convertir un éventuel .icns mal formé
    
    - name: Build macOS app
      # Le .spec définit l'application (mode dossier, fichier d'exemple inclus, version)
      run: pyinstaller --clean --noconfirm RepartitionServices.spec
    
    - name: Create macOS DMG
      run: |
        hdiutil create -volname "RepartitionServices" \
          -srcfolder "dist/RepartitionServices.app" \
          -ov -format UDZO \
          "dist/RepartitionServices.dmg"
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: RepartitionServices-macOS
        path: dist/RepartitionServices.dmg

  # Ajoute les exécutables à la release (publication d'une release, ou lancement manuel avec un tag)
  publier-release:
    needs: [build-windows, build-macos]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artefacts
        merge-multiple: true

    - name: Attach files to release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.release.tag_name || inputs.tag }}
        files: |
          artefacts/RepartitionServices.exe
          artefacts/RepartitionServices.dmg
