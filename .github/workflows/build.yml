name: Build Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [created]
  workflow_dispatch:  # Permet de lancer manuellement

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build Windows executable
      run: |
        pyinstaller --clean --onefile --windowed `
          --name "RepartitionServices" `
          --add-data "moteur;moteur" `
          --add-data "interface;interface" `
          --add-data "export;export" `
          --hidden-import tkinter `
          --hidden-import tkinter.ttk `
          --hidden-import csv `
          --hidden-import datetime `
          --icon assets/icon.ico `
          main.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: RepartitionServices-Windows
        path: dist/RepartitionServices.exe

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build macOS app
      run: |
        pyinstaller --clean --windowed \
          --name "RepartitionServices" \
          --add-data "moteur:moteur" \
          --add-data "interface:interface" \
          --add-data "export:export" \
          --hidden-import tkinter \
          --hidden-import tkinter.ttk \
          --hidden-import csv \
          --hidden-import datetime \
          --icon assets/icon.icns \
          --osx-bundle-identifier com.votreorganisation.repartitionservices \
          main.py
    
    - name: Create macOS DMG
      run: |
        hdiutil create -volname "RepartitionServices" \
          -srcfolder "dist/RepartitionServices.app" \
          -ov -format UDZO \
          "dist/RepartitionServices.dmg"
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: RepartitionServices-macOS
        path: dist/RepartitionServices.dmg